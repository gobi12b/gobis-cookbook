<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Save from share</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
a{transition:transform .2s cubic-bezier(.05,.7,.1,1),opacity .2s}
a:active{transform:scale(.97);opacity:.85}
.sheet{animation:slideup .5s cubic-bezier(.05,.7,.1,1) both}
.enter{animation:enter .45s cubic-bezier(.05,.7,.1,1) both}
.shimmer{background:linear-gradient(90deg,#272727 25%,#363636 50%,#272727 75%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
.pop{animation:pop .35s cubic-bezier(.05,.7,.1,1) both}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0F0F0F; font-family: Roboto, system-ui, sans-serif; color: #F1F1F1; box-sizing: border-box">
  <div style="padding: 68px 16px 0">
    <div class="shimmer" style="height: 201px; border-radius: 12px"></div>
    <div style="display: flex; gap: 12px; margin-top: 12px"><div class="shimmer" style="width: 36px; height: 36px; border-radius: 18px"></div><div style="flex: 1"><div class="shimmer" style="height: 14px; width: 80%; border-radius: 7px"></div><div class="shimmer" style="margin-top: 8px; height: 12px; width: 45%; border-radius: 6px"></div></div></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.6)"></div>

  <div class="sheet" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 16px 24px; background: #212121; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box">
    <div style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #717171"></div>
    <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.3px">Save to Cookbook</div>

    <div class="enter" style="display: flex; gap: 12px; align-items: center; animation-delay: .12s">
      <div style="position: relative; flex: none; width: 128px; height: 72px; border-radius: 8px; background: #3A2A22; overflow: hidden; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg><span style="position: absolute; right: 4px; bottom: 4px; padding: 1px 5px; border-radius: 4px; background: rgba(0,0,0,.8); font-size: 11px; font-weight: 500">Video</span></div>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #AAAAAA; line-height: 1.4"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2BA640" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>Title and thumbnail detected</div>
    </div>

    <div class="enter" style="animation-delay: .2s">
      <label for="title" style="font-size: 12px; font-weight: 500; color: #AAAAAA">Title</label>
      <input id="title" type="text" value="Butter chicken" style="display: block; width: 100%; height: 52px; margin-top: 6px; padding: 0 16px; border: 1px solid #3F3F3F; border-radius: 12px; background: #0F0F0F; font-family: inherit; font-size: 16px; font-weight: 500; color: #F1F1F1; outline: none; box-sizing: border-box">
    </div>

    <div class="enter" style="animation-delay: .28s">
      <div style="font-size: 12px; font-weight: 500; color: #AAAAAA">Add to group</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px">
        <span class="pop" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 8px; background: #F1F1F1; color: #0F0F0F; font-size: 14px; font-weight: 500; box-sizing: border-box"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0F0F0F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>Dinner</span>
        <span style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 8px; background: #272727; font-size: 14px; font-weight: 500; box-sizing: border-box">Tiffin</span>
        <span style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 8px; background: #272727; font-size: 14px; font-weight: 500; box-sizing: border-box">Quick</span>
        <span style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 8px; background: #272727; font-size: 14px; font-weight: 500; box-sizing: border-box">Sweets</span>
        <span style="display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 14px; border-radius: 8px; background: #272727; color: #3EA6FF; font-size: 14px; font-weight: 500; box-sizing: border-box">+ New</span>
      </div>
    </div>

    <div style="display: flex; gap: 10px; margin-top: 4px">
      <a href="Main.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 24px; background: #272727; font-size: 15px; font-weight: 500; text-decoration: none">Cancel</a>
      <a href="Main.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 24px; background: #F1F1F1; color: #0F0F0F; font-size: 15px; font-weight: 700; text-decoration: none">Save</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF0033","options":["#FF0033","#3EA6FF","#2BA640"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FF0033' };
  }
}
</script>
</body>
</html>
