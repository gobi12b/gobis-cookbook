<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recipe detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
a{transition:transform .2s cubic-bezier(.05,.7,.1,1),opacity .2s}
a:active{transform:scale(.97);opacity:.85}
.enter{animation:enter .5s cubic-bezier(.05,.7,.1,1) both}
.bar{transform-origin:left;animation:grow 2s .3s cubic-bezier(.2,0,0,1) both}
.pulse{animation:pulse 2.4s ease-out infinite}
@keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(.38)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}100%{box-shadow:0 0 0 20px rgba(255,255,255,0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0F0F0F; font-family: Roboto, system-ui, sans-serif; color: #F1F1F1; box-sizing: border-box">
  <div style="position: relative; height: 220px; margin-top: 0; background: #3A2A22; overflow: hidden">
    <div style="position: absolute; right: -60px; top: -80px; width: 260px; height: 260px; border-radius: 130px; background: rgba(255,255,255,.06)"></div>
    <div class="pulse" style="position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 28px; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg></div>
    <a href="Main.dc.html" aria-label="Back to recipes" style="position: absolute; left: 4px; top: 36px; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.3)"><div class="bar" style="width: 100%; height: 3px; background: {{accent}}"></div></div>
  </div>

  <div style="padding: 14px 16px 0">
    <div class="enter" style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
      <h1 style="margin: 0; font-size: 20px; font-weight: 500; line-height: 1.3">Butter chicken</h1>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F1F1F1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="enter" style="margin-top: 4px; font-size: 13px; color: #AAAAAA; animation-delay: .06s">Saved Nov 20 · Dinner · Quick</div>

    <div class="enter" style="display: flex; gap: 8px; margin: 14px -16px 0; padding: 0 16px; overflow: hidden; animation-delay: .12s">
      <a href="https://example.com" style="flex: none; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 20px; background: #F1F1F1; color: #0F0F0F; font-size: 14px; font-weight: 700; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="#0F0F0F" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>Watch original</a>
      <span style="flex: none; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 20px; background: #272727; font-size: 14px; font-weight: 500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F1F1F1" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Group</span>
      <span style="flex: none; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 20px; background: #272727; font-size: 14px; font-weight: 500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F1F1F1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7h16v-7M12 4v12M8 8l4-4 4 4"/></svg>Share</span>
    </div>

    <div class="enter" style="margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: #272727; animation-delay: .18s">
      <label for="notes" style="font-size: 14px; font-weight: 700">Notes</label>
      <textarea id="notes" rows="2" style="display: block; width: 100%; margin-top: 6px; padding: 0; border: 0; background: transparent; font-family: inherit; font-size: 14px; line-height: 1.5; color: #F1F1F1; resize: none; outline: none; box-sizing: border-box">Finish with kasuri methi and a spoon of cream.</textarea>
    </div>

    <div class="enter" style="margin-top: 20px; animation-delay: .24s">
      <div style="font-size: 16px; font-weight: 700">More from Dinner</div>
      <a href="Detail.dc.html" style="display: flex; gap: 12px; margin-top: 12px; text-decoration: none; color: inherit">
        <div style="position: relative; flex: none; width: 150px; height: 84px; border-radius: 8px; background: #3A2230; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg><span style="position: absolute; right: 4px; bottom: 4px; padding: 1px 5px; border-radius: 4px; background: rgba(0,0,0,.8); font-size: 11px; font-weight: 500">Reel</span></div>
        <div style="min-width: 0"><div style="font-size: 14px; font-weight: 500; line-height: 1.3">Paneer tikka masala</div><div style="margin-top: 4px; font-size: 12px; color: #AAAAAA">Dinner · 3 days ago</div></div>
      </a>
      <a href="Detail.dc.html" style="display: flex; gap: 12px; margin-top: 14px; text-decoration: none; color: inherit">
        <div style="position: relative; flex: none; width: 150px; height: 84px; border-radius: 8px; background: #22332B; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg><span style="position: absolute; right: 4px; bottom: 4px; padding: 1px 5px; border-radius: 4px; background: rgba(0,0,0,.8); font-size: 11px; font-weight: 500">Short</span></div>
        <div style="min-width: 0"><div style="font-size: 14px; font-weight: 500; line-height: 1.3">Dal tadka</div><div style="margin-top: 4px; font-size: 12px; color: #AAAAAA">Dinner · 1 week ago</div></div>
      </a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF0033","options":["#FF0033","#3EA6FF","#2BA640"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FF0033' };
  }
}
</script>
</body>
</html>
