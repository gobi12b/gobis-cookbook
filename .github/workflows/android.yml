name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same PR cancels the older run. Runs on main are never cancelled mid-flight,
# so a release tag never ends up without its APK.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  JAVA_VERSION: "25"

jobs:
  build-apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release on main
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # The action's default package list includes the long-removed 'tools', which fails sdkmanager.
      # AGP installs the compile SDK platform itself once licenses are accepted.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # Validates the Gradle wrapper jar's checksum and caches Gradle state between runs.
      - uses: gradle/actions/setup-gradle@v5

      # app/build.gradle.kts signs release builds from keystore.properties; recreate it from secrets.
      # Pull requests (no secrets) still build, but the release APK is unsigned there.
      - name: Set up signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::warning::No signing secrets for this pull request; the release APK will be unsigned."
              echo "signed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Signing secrets are missing (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build APKs
        run: ./gradlew :app:assembleRelease :app:assembleDebug

      - name: Verify signature
        if: steps.signing.outputs.signed == 'true'
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Name the APK
        id: name
        run: |
          version_name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          tag="v${version_name}-build.${GITHUB_RUN_NUMBER}"
          apk="GobisCookbook-${tag}.apk"
          cp app/build/outputs/apk/release/app-release*.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.signed == 'true' && 'gobis-cookbook-release-signed' || 'gobis-cookbook-release-unsigned' }}
          path: |
            ${{ steps.name.outputs.apk }}
            ${{ steps.name.outputs.apk }}.sha256
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gobis-cookbook-debug
          path: app/build/outputs/apk/debug/*.apk

      # Every signed build from main becomes a GitHub release with the APK attached.
      - name: Publish GitHub release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.name.outputs.tag }}" \
            "${{ steps.name.outputs.apk }}" "${{ steps.name.outputs.apk }}.sha256" \
            --target "$GITHUB_SHA" \
            --title "Gobi's Cookbook ${{ steps.name.outputs.tag }}" \
            --generate-notes

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" keystore.properties
