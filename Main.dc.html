<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recipe list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
a{transition:transform .2s cubic-bezier(.05,.7,.1,1),opacity .2s}
a:active{transform:scale(.97);opacity:.85}
.enter{animation:enter .5s cubic-bezier(.05,.7,.1,1) both}
.shimmer{background:linear-gradient(90deg,#272727 25%,#363636 50%,#272727 75%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
.snack{animation:snack .5s .9s cubic-bezier(.05,.7,.1,1) both}
.bar{transform-origin:left;animation:grow 1.6s .4s cubic-bezier(.2,0,0,1) both}
@keyframes enter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes snack{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0F0F0F; font-family: Roboto, system-ui, sans-serif; color: #F1F1F1; box-sizing: border-box">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 56px; margin-top: 12px; padding: 0 8px 0 16px">
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="width: 30px; height: 22px; border-radius: 7px; background: {{accent}}; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3V4z"/></svg></span>
      <span style="font-size: 20px; font-weight: 700; letter-spacing: -0.8px">Cookbook</span>
    </div>
    <div style="display: flex">
      <span aria-label="Search" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F1F1F1" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></span>
    </div>
  </div>

  <div style="display: flex; gap: 8px; padding: 0 16px; overflow: hidden">
    <span style="flex: none; display: inline-flex; align-items: center; min-height: 44px"><span style="display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; background: #F1F1F1; color: #0F0F0F; font-size: 14px; font-weight: 500">All</span></span>
    <span style="flex: none; display: inline-flex; align-items: center; min-height: 44px"><span style="display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; background: #272727; font-size: 14px; font-weight: 500">Dinner</span></span>
    <span style="flex: none; display: inline-flex; align-items: center; min-height: 44px"><span style="display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; background: #272727; font-size: 14px; font-weight: 500">Tiffin</span></span>
    <span style="flex: none; display: inline-flex; align-items: center; min-height: 44px"><span style="display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; background: #272727; font-size: 14px; font-weight: 500">Quick</span></span>
    <span style="flex: none; display: inline-flex; align-items: center; min-height: 44px"><span style="display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; background: #272727; font-size: 14px; font-weight: 500">Sweets</span></span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 22px; padding: 4px 16px 0">
    <div class="enter">
      <div class="shimmer" style="position: relative; height: 201px; border-radius: 12px"></div>
      <div style="display: flex; gap: 12px; margin-top: 12px">
        <div class="shimmer" style="flex: none; width: 36px; height: 36px; border-radius: 18px"></div>
        <div style="flex: 1">
          <div class="shimmer" style="height: 14px; width: 82%; border-radius: 7px"></div>
          <div class="shimmer" style="margin-top: 8px; height: 12px; width: 48%; border-radius: 6px"></div>
        </div>
        <div style="font-size: 12px; font-weight: 500; color: #AAAAAA">Fetching title…</div>
      </div>
    </div>

    <a class="enter" href="Detail.dc.html" style="display: block; text-decoration: none; color: inherit; animation-delay: .12s">
      <div style="position: relative; height: 201px; border-radius: 12px; background: #3A2A22; overflow: hidden">
        <div style="position: absolute; right: -40px; top: -50px; width: 200px; height: 200px; border-radius: 100px; background: rgba(255,255,255,.06)"></div>
        <div style="position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 24px; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg></div>
        <span style="position: absolute; right: 8px; bottom: 8px; padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,.8); font-size: 12px; font-weight: 500">Video</span>
        <span style="position: absolute; left: 8px; top: 8px; padding: 2px 6px; border-radius: 4px; background: {{accent}}; font-size: 11px; font-weight: 700; letter-spacing: .5px">NEW</span>
        <div class="bar" style="position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: {{accent}}"></div>
      </div>
      <div style="display: flex; gap: 12px; margin-top: 12px">
        <span style="flex: none; width: 36px; height: 36px; border-radius: 18px; background: #5A3A2A; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500">D</span>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 16px; font-weight: 500; line-height: 1.3">Butter chicken</div>
          <div style="margin-top: 3px; font-size: 12px; color: #AAAAAA">Dinner · Video · Just now</div>
        </div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#F1F1F1" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
      </div>
    </a>

    <a class="enter" href="Detail.dc.html" style="display: block; text-decoration: none; color: inherit; animation-delay: .24s">
      <div style="position: relative; height: 201px; border-radius: 12px; background: #3A3622; overflow: hidden">
        <div style="position: absolute; left: -50px; bottom: -70px; width: 220px; height: 220px; border-radius: 110px; background: rgba(255,255,255,.06)"></div>
        <div style="position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 24px; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg></div>
        <span style="position: absolute; right: 8px; bottom: 8px; padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,.8); font-size: 12px; font-weight: 500">Reel</span>
      </div>
      <div style="display: flex; gap: 12px; margin-top: 12px">
        <span style="flex: none; width: 36px; height: 36px; border-radius: 18px; background: #5E5624; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500">T</span>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 16px; font-weight: 500; line-height: 1.3">Masala dosa</div>
          <div style="margin-top: 3px; font-size: 12px; color: #AAAAAA">Tiffin · Reel · 2 days ago</div>
        </div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#F1F1F1" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
      </div>
    </a>
  </div>

  <div class="snack" style="position: absolute; left: 12px; right: 12px; bottom: 76px; display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 16px; border-radius: 8px; background: #F1F1F1; color: #0F0F0F; font-size: 14px; font-weight: 500">
    <span>Saved to Dinner</span>
    <span style="color: #065FD4; font-weight: 700">Change</span>
  </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: flex; align-items: center; background: #0F0F0F">
    <a href="Main.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; font-size: 10px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#F1F1F1" aria-hidden="true"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3V4z"/></svg>
      Recipes
    </a>
    <a href="ShareSheet.dc.html" aria-label="Add recipe" style="flex: 1; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <span style="width: 44px; height: 44px; border: 2px solid #F1F1F1; border-radius: 22px; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F1F1F1" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
    </a>
    <a href="Groups.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #AAAAAA; font-size: 10px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="9" width="16" height="11" rx="2"/><path d="M7 6h10M9 3h6"/></svg>
      Groups
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF0033","options":["#FF0033","#3EA6FF","#2BA640"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FF0033' };
  }
}
</script>
</body>
</html>
